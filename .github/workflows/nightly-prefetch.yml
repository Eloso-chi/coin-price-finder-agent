# PCGS APR Prefetch -- Manual Containment Trigger
# Automatic safety-net scheduling is disabled during the #314H incident.
# Keep workflow_dispatch available for controlled operator diagnostics only.

name: Nightly Prefetch Trigger

on:
  # #314H containment: automatic triggers remain disabled until systemic
  # IsValidRequest=false handling is deployed and production-validated.
  workflow_dispatch: # Preserve controlled manual diagnostics from GitHub UI

jobs:
  trigger-prefetch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wake up App Service (health check)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://coinpricefinder-h3a3b5g0dmdydna4.azurewebsites.net/api/health")
          echo "Health check: HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::App Service health check returned $STATUS"
            # Retry once after 10s (cold start)
            sleep 10
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://coinpricefinder-h3a3b5g0dmdydna4.azurewebsites.net/api/health")
            echo "Retry health check: HTTP $STATUS"
            if [ "$STATUS" != "200" ]; then
              echo "::error::App Service is down"
              exit 1
            fi
          fi

      - name: Trigger prefetch run
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          TRIGGER_TIME=$(date -u +%s)
          echo "TRIGGER_TIME=$TRIGGER_TIME" >> "$GITHUB_ENV"
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "x-api-key: ${ADMIN_API_KEY}" \
            "https://coinpricefinder-h3a3b5g0dmdydna4.azurewebsites.net/api/admin/prefetch-trigger")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "Trigger response: HTTP $HTTP_CODE"
          echo "$BODY" | python3 -m json.tool 2>/dev/null || echo "$BODY"
          # 202 Accepted is expected (fire-and-forget)
          if [ "$HTTP_CODE" != "202" ] && [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Prefetch trigger failed with HTTP $HTTP_CODE"
            exit 1
          fi
          # Store the trigger response for later steps
          echo "$BODY" > /tmp/trigger_response.json
          STARTED=$(echo "$BODY" | python3 -c "import sys, json; print(json.load(sys.stdin).get('started', False))" 2>/dev/null || echo "False")
          echo "PREFETCH_STARTED=$STARTED" >> "$GITHUB_ENV"

      - name: Poll prefetch status until completion
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          if [ "$PREFETCH_STARTED" != "True" ]; then
            REASON=$(python3 -c "import json; print(json.load(open('/tmp/trigger_response.json')).get('reason', 'Trigger did not start a run'))" 2>/dev/null || echo "Trigger did not start a run")
            echo "Prefetch not started: $REASON"
            echo "$REASON" > /tmp/prefetch_not_started_reason.txt
            exit 0
          fi

          echo "Waiting for prefetch to complete..."
          MAX_POLLS=180  # 30 minutes with 10s intervals
          POLL_INTERVAL=10
          COMPLETED=false
          LAST_RUN=""
          LAST_RUN_EPOCH=0
          MIN_COMPLETION_TIME=$((TRIGGER_TIME - 5))
          
          for i in $(seq 1 $MAX_POLLS); do
            sleep $POLL_INTERVAL
            RESPONSE=$(curl -s \
              -H "x-api-key: ${ADMIN_API_KEY}" \
              "https://coinpricefinder-h3a3b5g0dmdydna4.azurewebsites.net/api/admin/prefetch-status")
            
            # A prior run can leave todayCompleted=true. Correlate completion
            # to the run triggered by this workflow using its lastRun timestamp.
            read -r COMPLETED LAST_RUN LAST_RUN_EPOCH < <(echo "$RESPONSE" | python3 -c 'import datetime,json,sys; data=json.load(sys.stdin); last_run=data.get("lastRun") or ""; epoch=int(datetime.datetime.fromisoformat(last_run.replace("Z", "+00:00")).timestamp()) if last_run else 0; print(data.get("todayCompleted", False), last_run or "none", epoch)' 2>/dev/null || echo "False none 0")
            
            if [ "$COMPLETED" = "True" ] && [ "$LAST_RUN_EPOCH" -ge "$MIN_COMPLETION_TIME" ]; then
              echo "Prefetch completed successfully"
              echo "Status:"
              echo "$RESPONSE" | python3 -m json.tool 2>/dev/null
              echo "$RESPONSE" > /tmp/prefetch_final_status.json
              exit 0
            fi
            
            # Show progress every 30 seconds
            if [ $((i % 3)) -eq 0 ]; then
              echo "Poll $i/$MAX_POLLS: lastRun=$LAST_RUN (epoch $LAST_RUN_EPOCH), trigger=$TRIGGER_TIME; waiting..."
            fi
          done
          
          # Timeout: show last status and warn (don't fail)
          echo "::warning::Prefetch polling timed out after 30 minutes"
          echo "Last status:"
          echo "$RESPONSE" | python3 -m json.tool 2>/dev/null || echo "$RESPONSE"
          # Don't exit with error — prefetch may still be running
          exit 0

      - name: Report prefetch results
        if: always()
        run: |
          if [ -f /tmp/prefetch_final_status.json ]; then
            echo "## ✓ Nightly APR Prefetch Completed" >> $GITHUB_STEP_SUMMARY
            {
              echo "| Metric | Value |"
              echo "|--------|-------|"
              echo "| API calls made | $(jq -r '.lastCallsMade // 0' /tmp/prefetch_final_status.json) |"
              echo "| New records | $(jq -r '.lastNewRecords // 0' /tmp/prefetch_final_status.json) |"
              echo "| Duration | $(jq -r '.lastDuration // "unknown"' /tmp/prefetch_final_status.json) |"
              echo "| Status | $(jq -r '.lastStatus // "unknown"' /tmp/prefetch_final_status.json) |"
              echo "| Quota remaining | $(jq -r '.quota.remaining // "unknown"' /tmp/prefetch_final_status.json) |"
              echo "| Queue remaining | $(jq -r '.queueRemaining // 0' /tmp/prefetch_final_status.json) |"
            } >> $GITHUB_STEP_SUMMARY
          elif [ -f /tmp/prefetch_not_started_reason.txt ]; then
            echo "## Nightly APR Prefetch Not Started" >> $GITHUB_STEP_SUMMARY
            echo "$(cat /tmp/prefetch_not_started_reason.txt)" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ⚠ Prefetch Status Unknown" >> $GITHUB_STEP_SUMMARY
            echo "Could not confirm prefetch completion. Check /api/admin/prefetch-status manually." >> $GITHUB_STEP_SUMMARY
          fi
